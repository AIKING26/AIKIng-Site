    <!-- ============================================================
         JSON-LD STRUCTURED DATA — schema.org/MusicGroup
         Tells Google: "This is a musician/band, here are the official
         social handles, here is the discography." Triggers the
         Knowledge Panel + verified-social-handles experience on Google
         search results for the artist's name.
         ============================================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicGroup",
      "name": "AI KING",
      "alternateName": ["Official AI KING", "OfficialAIKING"],
      "url": "https://officialaiking.com",
      "image": "https://officialaiking.com/images/hero-bw.jpg",
      "logo": "https://officialaiking.com/favicon.svg",
      "description": "Independent hip-hop artist. Unfiltered. Direct to you.",
      "genre": ["Hip Hop", "Rap", "Independent Hip Hop"],
      "foundingLocation": {
        "@type": "Place",
        "name": "South Florida, United States"
      },
      "sameAs": [
        "https://instagram.com/OfficialAIKING",
        "https://tiktok.com/@KingAI.Jay",
        "https://youtube.com/@OfficialAIKING",
        "https://x.com/OfficialAIKING"
      ],
      "album": [
        {
          "@type": "MusicRecording",
          "name": "EVERYTHING OFFICIAL",
          "byArtist": { "@type": "MusicGroup", "name": "AI KING" },
          "url": "https://officialaiking.com/audio/everything-official.mp3"
        },
        {
          "@type": "MusicRecording",
          "name": "SOLDIER WITH IT",
          "byArtist": { "@type": "MusicGroup", "name": "AI KING" },
          "url": "https://officialaiking.com/audio/soldier-with-it.mp3"
        },
        {
          "@type": "MusicRecording",
          "name": "TO THE SKY",
          "byArtist": { "@type": "MusicGroup", "name": "AI KING" },
          "url": "https://officialaiking.com/audio/to-the-sky.mp3"
        },
        {
          "@type": "MusicRecording",
          "name": "MEANT PUSSY",
          "byArtist": { "@type": "MusicGroup", "name": "AI KING" },
          "url": "https://officialaiking.com/audio/meant-pussy.mp3"
        }
      ]
    }
    </script>

    <!-- ============================================================
         JSON-LD — WebSite schema enables Sitelinks Search Box
         on Google results for the artist's name.
         ============================================================ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AI KING",
      "url": "https://officialaiking.com",
      "publisher": {
        "@type": "MusicGroup",

      }
    }
    </script>

    </style>
